services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-contact_enrichment}
      MYSQL_USER: ${DB_USER:-appuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-apppassword}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30  
    restart: unless-stopped

  api:
    build: ./api
    environment:
      DB_PORT: 3307
      DB_HOST: db
      DB_USER: ${DB_USER:-appuser}
      DB_PASSWORD: ${DB_PASSWORD:-apppassword}
      DB_NAME: ${DB_NAME:-contact_enrichment}
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_key}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  addin:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./add-in/src:/usr/share/nginx/html

volumes:
  mysql_data: