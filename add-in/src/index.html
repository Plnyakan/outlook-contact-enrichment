<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outlook Contact Enrichment</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <div class="login-container" id="loginSection">
            <h2>Login</h2>
            <form id="loginForm">
                <input type="email" id="loginEmail" placeholder="Email" required>
                <input type="password" id="loginPassword" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
        </div>
        
        <div class="main-container" id="mainSection" style="display: none;">
            <h1>Contact Enrichment</h1>
            <div class="email-input">
                <input type="email" id="emailInput" placeholder="Enter sender's email">
                <button id="enrichBtn">Enrich</button>
            </div>
            <div id="contactInfo"></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
